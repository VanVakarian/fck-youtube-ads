<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <title>YouTube Ad Skipper</title>
  <link rel="stylesheet"
        href="popup.css">
</head>

<body class="popup-container">
  <div class="switch-container">
    <input type="checkbox"
           id="adBlockToggle"
           class="switch-input">

    <label for="adBlockToggle"
           class="switch">
      <span class="switch-handle" />
    </label>
  </div>

  <div class="status-text">
    <span id="statusMessage">Ad Skipper is disabled</span>
  </div>

  <div class="slider-section">
    <div class="slider-label">
      <span>Transparency</span>
      <span id="transparencyValue"
            class="slider-value">90%</span>
    </div>
    <input type="range"
           id="transparencySlider"
           class="slider-input"
           min="0"
           max="100"
           step="1"
           value="90">

    <div class="color-picker">
      <span class="color-picker-label">Overlay color</span>
      <div class="color-buttons">
        <button type="button"
                id="colorBlack"
                class="color-btn color-btn-black active"
                data-color="black">
        </button>
        <button type="button"
                id="colorWhite"
                class="color-btn color-btn-white"
                data-color="white">
        </button>
      </div>
    </div>
  </div>

  <div class="debug-section">
    <label class="debug-toggle">
      <input type="checkbox"
             id="debugToggle">
      <span>Collect debug logs</span>
    </label>
    <div id="debugSize"
         class="debug-size">Log: 0.00 MB</div>
    <div class="debug-buttons">
      <button type="button"
              id="debugDownload"
              class="debug-btn">Download</button>
      <button type="button"
              id="debugClear"
              class="debug-btn">Clear</button>
    </div>
  </div>

  <script src="diagnostics.js"></script>
  <script src="popup.js"></script>
</body>

</html>
